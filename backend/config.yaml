# Vakil AI — experiment profiles.
#
# A profile = embedding model + chunking knobs + index enrichment. Each profile
# indexes into its OWN vector DB (db_path, default vectors-<profile>.db), so
# several model/chunking combinations can coexist and be compared:
#
#   python -m app.indexer --profile <name>          # build that profile's index
#   python -m app.evals.run_eval --profile <name>   # score it
#   python -m app.evals.compare                     # side-by-side metrics table
#
# The API server and the processing pipeline use active_profile (override per
# shell with VAKIL_PROFILE=<name>, config path with VAKIL_CONFIG=<path>).
# Docling parsing happens once per document regardless of profile — the indexer
# re-chunks from output/<doc>/markdown.md with the profile's chunking config.
#
# Prefix note: nomic-embed-text and mxbai-embed-large are prefix-trained for
# asymmetric retrieval; dropping their prefixes silently degrades quality.
# Symmetric models (all-minilm) take empty prefixes.

active_profile: nomic-default

# Agent loop answering /agent/ask — same toolset, different orchestration.
# hand-rolled = the raw 3a loop; langgraph = the 3b graph port (checkpointed
# chat state, room for corrective-RAG nodes). Switch: flip kind, per shell
# VAKIL_AGENT=<kind>, or per request ?agent=<kind>.
agent:
  kind: langgraph

# Generation (chat) models — top-level, NOT a profile knob: they only read
# retrieved text, so switching never invalidates any vector index.
# Switch: flip `active`, or per shell VAKIL_CHAT_MODEL=<name>.
generation:
  active: deepseek-api
  models:
    llama:
      provider: ollama # ChatModel implementation (llm/)
      base_url: http://localhost:11434
      model: llama3.1
      num_ctx: 8192 # RAG prompts are big; Ollama silently truncates on overflow
      temperature: 0.0 # grounded QA wants determinism, not variety
      timeout_s: 300

    # Reasoning model — emits <think>...</think> before answering (stripped
    # by OllamaChat). Slower per answer; compare against llama via evals.
    deepseek:
      provider: ollama
      base_url: http://localhost:11434
      model: deepseek-r1:8b
      num_ctx: 8192
      temperature: 0.0
      timeout_s: 600 # thinking tokens take time

    # DeepSeek's HOSTED API (no local weights) — OpenAI-compatible wire
    # format. `export DEEPSEEK_API_KEY=sk-...` then flip active (or
    # VAKIL_CHAT_MODEL=deepseek-api). model: deepseek-chat = V3 (fast),
    # deepseek-reasoner = R1 (thinking). num_ctx ignored (server-side).
    deepseek-api:
      provider: openai-compatible
      base_url: https://api.deepseek.com
      model: deepseek-chat
      api_key_env: DEEPSEEK_API_KEY
      temperature: 0.0
      timeout_s: 120

# Pipeline-level components (shared by all profiles; registry names in
# parser.py / metadata.py). A parser change must bump PIPELINE_VERSION.
components:
  parser: docling
  metadata_extractor: regex
  citation_extractor: regex # citation graph edges; backfill via app.citations.backfill

profiles:
  nomic-default:
    store: sqlite # VectorIndex implementation (vector_store.py)
    db_path: vectors.db # pre-existing index from before profiles existed
    embedding:
      provider: ollama
      base_url: http://localhost:11434
      model: nomic-embed-text
      dim: 768
      batch_size: 64
      timeout_s: 120
      document_prefix: "search_document: "
      query_prefix: "search_query: "
    chunking:
      strategy: section-aware # Chunker implementation (chunker.py)
      target_tokens: 700
      max_tokens: 900
      min_tokens: 120
      overlap_tokens: 80
      encoding: cl100k_base
    indexing:
      enrich: true
    # Query-time strategy — outside the index fingerprint: FTS5 is derived
    # from stored payloads, so dense<->hybrid flips never invalidate vectors.
    retrieval:
      strategy: hybrid # dense | hybrid (BM25 + RRF)
      # Swept in 2b (see evals/results/hybrid-*.json): canonical c50/k60 got
      # citation recall@5 only 0.333 — with dense a pure-noise ranker on
      # citation queries, deep lists + flat RRF let junk chunks matching in
      # BOTH lists ("false consensus") outrank lexical's correct #1. c20/k10
      # = 0.833 with conceptual types all at 1.0.
      candidates: 20 # depth per ranker before fusion
      rrf_k: 10 # sharper than the Cormack 60 default — see note above
      rewrite:
        # Regex citation detector -> FTS5 phrase list joins RRF (q017 cure:
        # phrases express the token ADJACENCY that OR queries throw away).
        # 2c winner (evals/results/2c-citations.json): citation passage@5
        # .833 -> 1.0, passage@1 .226 -> .419, mrr .835 -> .962; only the 12
        # citation questions moved — the phrase list is inert elsewhere.
        citations: true
        # LLM keyword rewrite (q004 cure) — MEASURED NET-NEGATIVE here, off:
        # paraphrase@5 .286 -> .429 but holding 1.0 -> .85, passage@5 .871 ->
        # .855, +7.4s/query (2c-rewrite.json). The extra lists out-fuse gold
        # chunks at top-5 — the 2b false-consensus tax, re-paid.
        llm: false
        model: llama # llama3.1 — deepseek's thinking tokens too slow per-query
      # Cross-encoder precision stage — MEASURED NET-NEGATIVE here, off:
      # best variant (BAAI/bge-reranker-base, 2c-rerank-bge.json) passage@5
      # .774 vs .871 without; MiniLM-L-6 far worse (.645). Wide c50/pool50
      # was worse still (.758) — the "2b knobs compensated for a missing
      # precision stage" thesis FALSIFIED at this corpus/model scale: the
      # judge misjudges long legal chunks (topical-relevance over exact
      # evidence, 512-token truncation), so it overrides the phrase list's
      # decisive rankings. Knob stays: a stronger/longer reranker is a yaml
      # edit away.
      rerank:
        enabled: false
        provider: cross-encoder
        model: BAAI/bge-reranker-base # best of 3 tried; MiniLM L-6/L-12 weaker
        pool: 30
        batch_size: 16

  # Same model, smaller chunks — isolates the chunking variable.
  nomic-small-chunks:
    embedding:
      model: nomic-embed-text
      dim: 768
      document_prefix: "search_document: "
      query_prefix: "search_query: "
    chunking:
      target_tokens: 350
      max_tokens: 450
      min_tokens: 60
      overlap_tokens: 40

  # Different model — `ollama pull mxbai-embed-large` first.
  # mxbai-large:
  #   embedding:
  #     model: mxbai-embed-large
  #     dim: 1024
  #     query_prefix: "Represent this sentence for searching relevant passages: "
  #   chunking:
  #     target_tokens: 700
  #     max_tokens: 900
  #     min_tokens: 120
  #     overlap_tokens: 80

  # Small symmetric model, no prefixes — `ollama pull all-minilm` first.
  # minilm:
  #   embedding:
  #     model: all-minilm
  #     dim: 384
